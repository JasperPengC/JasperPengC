<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Jasper — AI Agent Tooling · DeepSeek Harness Ecosystem</title>
  <desc id="heroDesc">Neon deep-space banner: JASPER, AI agent tooling, DSH ecosystem, open source.</desc>

  <defs>
    <linearGradient id="bgFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8ff"/>
      <stop offset=".52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8f5ff"/>
    </linearGradient>
    <radialGradient id="auroraCyan" cx="150" cy="-90" r="660" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.143"/>
      <stop offset=".42" stop-color="#0e7490" stop-opacity="0.050"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.000"/>
    </radialGradient>
    <radialGradient id="auroraViolet" cx="1090" cy="30" r="590" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b21b6" stop-opacity="0.134"/>
      <stop offset=".45" stop-color="#5b21b6" stop-opacity="0.050"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.000"/>
    </radialGradient>
    <radialGradient id="auroraPink" cx="620" cy="400" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.000"/>
    </radialGradient>
    <linearGradient id="titleFill" x1="60" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset=".3" stop-color="#0e7490"/>
      <stop offset=".66" stop-color="#5b21b6"/>
      <stop offset=".9" stop-color="#db2777"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="lineFill" x1="75" y1="0" x2="336" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e7490" stop-opacity=".9"/>
      <stop offset="1" stop-color="#5b21b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0"/>
      <stop offset=".18" stop-color="#0e7490" stop-opacity=".9"/>
      <stop offset=".82" stop-color="#5b21b6" stop-opacity=".9"/>
      <stop offset="1" stop-color="#5b21b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="borderFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#5b21b6" stop-opacity=".18"/>
      <stop offset="1" stop-color="#db2777" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="sweepFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0"/>
      <stop offset=".5" stop-color="#0e7490" stop-opacity=".5"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#7e22ce" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="orbFill" cx=".34" cy=".26" r=".92">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".85"/>
      <stop offset=".22" stop-color="#0ea5e9" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#5b21b6" stop-opacity=".26"/>
      <stop offset="1" stop-color="#0369a1" stop-opacity=".06"/>
    </radialGradient>
    <radialGradient id="orbHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.130"/>
      <stop offset=".55" stop-color="#5b21b6" stop-opacity="0.050"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.000"/>
    </radialGradient>
    <linearGradient id="ringFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7490" stop-opacity=".05"/>
      <stop offset=".5" stop-color="#0e7490" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5b21b6" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".46" r=".78">
      <stop offset=".55" stop-color="#000" stop-opacity="0.000"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.360"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0ea5e9" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" fill="#94a3b8" opacity=".022"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="cardClip"><rect width="1200" height="420" rx="20"/></clipPath>
    <clipPath id="globeClip"><circle cx="985" cy="175" r="80"/></clipPath>
  </defs>
  <style>
    @keyframes twinkle { 0%,100% { opacity:.14 } 50% { opacity:.95 } }
    @keyframes sweep { 0% { transform:translateY(-160px) } 100% { transform:translateY(460px) } }
    @keyframes shoot {
      0%,64% { opacity:0; transform:translate(0,0) }
      68% { opacity:.95; transform:translate(-44px,26px) }
      84% { opacity:0; transform:translate(-190px,112px) }
      100% { opacity:0; transform:translate(-190px,112px) }
    }
    @keyframes eq { 0%,100% { transform:scaleY(.35) } 50% { transform:scaleY(1) } }
    @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
    @keyframes pulse { 0%,100% { opacity:.35; transform:scale(1) } 50% { opacity:.05; transform:scale(1.06) } }
    @keyframes spin-slow { 0% { transform:rotate(0deg) } 100% { transform:rotate(360deg) } }
    .pulse { transform-box:fill-box; transform-origin:center; animation:pulse 4.2s ease-in-out infinite }
    .cursor { animation:blink 1.15s steps(1,end) infinite }
  </style>
  <g clip-path="url(#cardClip)">
    <rect width="1200" height="420" fill="url(#bgFill)"/>
    <rect width="1200" height="420" fill="url(#auroraCyan)"/>
    <rect width="1200" height="420" fill="url(#auroraViolet)"/>
    <rect width="1200" height="420" fill="url(#auroraPink)"/>
    <rect width="1200" height="420" fill="url(#grid)" opacity=".55"/>
    <!-- hologram globe -->
    <circle cx="985" cy="175" r="196" fill="url(#orbHalo)"/>
    <g clip-path="url(#globeClip)">
      <circle cx="985" cy="175" r="80" fill="url(#orbFill)"/>
      <g fill="none" stroke="#0e7490" stroke-opacity=".22" stroke-width=".8">
        <ellipse cx="985" cy="175" rx="80" ry="26"/>
        <ellipse cx="985" cy="175" rx="80" ry="53"/>
        <ellipse cx="985" cy="175" rx="80" ry="79"/>
        <ellipse cx="985" cy="175" rx="26" ry="80"/>
        <ellipse cx="985" cy="175" rx="53" ry="80"/>
        <ellipse cx="985" cy="175" rx="79" ry="80"/>
      </g>
      <circle cx="985" cy="175" r="80" fill="none" stroke="#0ea5e9" stroke-opacity=".5" stroke-width="1.1"/>
    </g>
    <g transform="rotate(-18 985 175)">
      <ellipse cx="985" cy="175" rx="136" ry="41" fill="none" stroke="url(#ringFill)" stroke-width="1.3" stroke-dasharray="5 9"/>
      <ellipse cx="985" cy="175" rx="116" ry="35" fill="none" stroke="url(#ringFill)" stroke-width="1" stroke-dasharray="3 7" opacity=".8"/>
      <ellipse cx="985" cy="175" rx="95" ry="24" fill="none" stroke="url(#ringFill)" stroke-width=".9" stroke-dasharray="2 6" opacity=".65"/>
      <circle r="3.4" fill="#0ea5e9">
        <animateMotion dur="13s" repeatCount="indefinite" path="M849,175 a136,41 0 1,1 272,0 a136,41 0 1,1 -272,0"/>
      </circle>
      <circle r="9" fill="#0e7490" opacity=".16">
        <animateMotion dur="13s" repeatCount="indefinite" path="M849,175 a136,41 0 1,1 272,0 a136,41 0 1,1 -272,0"/>
      </circle>
      <circle r="2.4" fill="#db2777">
        <animateMotion dur="19s" repeatCount="indefinite" path="M869,175 a116,35 0 1,1 232,0 a116,35 0 1,1 -232,0" keyPoints="1;0" keyTimes="0;1" calcMode="linear"/>
      </circle>
    </g>
    <circle cx="985" cy="175" r="120" fill="none" stroke="#5b21b6" stroke-opacity=".16" stroke-width=".8" stroke-dasharray="2 12"/>
    <circle cx="985" cy="175" r="120" fill="none" stroke="#0ea5e9" stroke-opacity=".08" stroke-width="8" class="pulse"/>

    <!-- terminal headline block -->
    <rect x="56" y="82" width="2.2" height="300" rx="1.1" fill="url(#edgeFill)"/>
    <rect x="52.6" y="82" width="10" height="10" rx="2" fill="#0e7490" opacity=".9" style="animation:blink 2.4s steps(1,end) infinite"/>
    <rect x="52.6" y="372" width="10" height="10" rx="2" fill="#5b21b6" opacity=".75"/>
    <text x="80" y="108" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="14" letter-spacing="3.0" fill="#0e7490" opacity=".72">// PROFILE.SYS · AI APPLICATION ENGINEER</text>
    <text x="72" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="96" font-weight="800" letter-spacing="7" fill="url(#titleFill)">JASPER</text>
    <path d="M75 240 H360" stroke="url(#lineFill)" stroke-width="1.8"/>
    <rect x="356" y="235.5" width="10" height="10" rx="2" transform="rotate(45 361 240.5)" fill="#0e7490" opacity=".85"/>
    <text x="75" y="280" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="20" letter-spacing=".6" fill="#0e7490"><tspan fill="#5b21b6">&gt;</tspan> AI APPLICATION &amp; AGENT ENGINEER</text>
    <text x="76" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="18" letter-spacing=".4" fill="#64748b">AI 应用 / 智能体 · 资深全栈</text>
    <text x="76" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="18" letter-spacing=".4" fill="#64748b">把想法做成能上线的产品</text>
    <g><rect x="74" y="360" width="62" height="32" rx="9" fill="#f1f5f9" stroke="#c7d2e3" stroke-opacity=".9"/><circle cx="88" cy="376" r="3.2" fill="#c2410c"/><text x="98" y="381" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" letter-spacing="1.4" fill="#94a3b8">JAVA</text></g><g><rect x="146" y="360" width="80" height="32" rx="9" fill="#f1f5f9" stroke="#c7d2e3" stroke-opacity=".9"/><circle cx="160" cy="376" r="3.2" fill="#a16207"/><text x="170" y="381" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" letter-spacing="1.4" fill="#94a3b8">PYTHON</text></g><g><rect x="236" y="360" width="44" height="32" rx="9" fill="#f1f5f9" stroke="#c7d2e3" stroke-opacity=".9"/><circle cx="250" cy="376" r="3.2" fill="#0e7490"/><text x="260" y="381" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" letter-spacing="1.4" fill="#94a3b8">GO</text></g><g><rect x="290" y="360" width="62" height="32" rx="9" fill="#f1f5f9" stroke="#c7d2e3" stroke-opacity=".9"/><circle cx="304" cy="376" r="3.2" fill="#c2410c"/><text x="314" y="381" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" letter-spacing="1.4" fill="#94a3b8">RUST</text></g><g><rect x="362" y="360" width="116" height="32" rx="9" fill="#f1f5f9" stroke="#c7d2e3" stroke-opacity=".9"/><circle cx="376" cy="376" r="3.2" fill="#1d4ed8"/><text x="386" y="381" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" letter-spacing="1.4" fill="#94a3b8">TYPESCRIPT</text></g>
    <g opacity=".92">
      <text x="600" y="120" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" letter-spacing="2.2" fill="#64748b">$ cat .now</text>
      <text x="580" y="156" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="15.5" fill="#64748b">├─ <tspan fill="#0369a1">agent-blackbox</tspan> <tspan fill="#64748b">(MIT)</tspan></text>
      <text x="580" y="186" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="15.5" fill="#64748b">├─ <tspan fill="#5b21b6">dsh-mcp-skills-board</tspan> <tspan fill="#64748b">(MIT)</tspan></text>
      <text x="580" y="216" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="15.5" fill="#64748b">└─ <tspan fill="#db2777">open to AI Agent roles</tspan></text>
      <text x="580" y="246" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="15.5" fill="#64748b"><tspan fill="#15803d">●</tspan> keep building.</text>
    </g>

