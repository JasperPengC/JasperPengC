    <rect x="862.0" y="333.4" width="6.5" height="18.6" rx="3" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.60s ease-in-out -2.27s infinite"/><rect x="876.5" y="318.0" width="6.5" height="34.0" rx="3" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.53s ease-in-out -0.52s infinite"/><rect x="891.0" y="323.4" width="6.5" height="28.6" rx="3" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.57s ease-in-out -2.08s infinite"/><rect x="905.5" y="329.5" width="6.5" height="22.5" rx="3" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.54s ease-in-out -0.65s infinite"/><rect x="920.0" y="346.1" width="6.5" height="5.9" rx="3" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.03s ease-in-out -0.14s infinite"/><rect x="934.5" y="348.9" width="6.5" height="3.1" rx="3" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.11s ease-in-out -0.71s infinite"/><rect x="949.0" y="341.0" width="6.5" height="11.0" rx="3" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.72s ease-in-out -2.12s infinite"/><rect x="963.5" y="326.2" width="6.5" height="25.8" rx="3" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.08s ease-in-out -2.36s infinite"/><rect x="978.0" y="316.1" width="6.5" height="35.9" rx="3" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.44s ease-in-out -1.44s infinite"/><rect x="992.5" y="319.5" width="6.5" height="32.5" rx="3" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.44s ease-in-out -1.19s infinite"/><rect x="1007.0" y="331.9" width="6.5" height="20.1" rx="3" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.64s ease-in-out -1.15s infinite"/><rect x="1021.5" y="332.3" width="6.5" height="19.7" rx="3" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.55s ease-in-out -1.79s infinite"/><rect x="1036.0" y="343.8" width="6.5" height="8.2" rx="3" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.50s ease-in-out -0.95s infinite"/><rect x="1050.5" y="344.5" width="6.5" height="7.5" rx="3" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.41s ease-in-out -1.52s infinite"/><rect x="1065.0" y="340.5" width="6.5" height="11.5" rx="3" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.68s ease-in-out -0.79s infinite"/><rect x="1079.5" y="323.8" width="6.5" height="28.2" rx="3" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.27s ease-in-out -1.30s infinite"/><rect x="1094.0" y="313.0" width="6.5" height="39.0" rx="3" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.95s ease-in-out -0.70s infinite"/><rect x="1108.5" y="332.1" width="6.5" height="19.9" rx="3" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.29s ease-in-out -1.26s infinite"/>

