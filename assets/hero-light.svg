    <rect x="862.0" y="288.1" width="5.5" height="13.9" rx="2.6" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.60s ease-in-out -2.27s infinite"/><rect x="876.5" y="275.8" width="5.5" height="26.2" rx="2.6" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.53s ease-in-out -0.52s infinite"/><rect x="891.0" y="280.1" width="5.5" height="21.9" rx="2.6" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.57s ease-in-out -2.08s infinite"/><rect x="905.5" y="285.0" width="5.5" height="17.0" rx="2.6" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.54s ease-in-out -0.65s infinite"/><rect x="920.0" y="298.3" width="5.5" height="3.7" rx="2.6" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.03s ease-in-out -0.14s infinite"/><rect x="934.5" y="300.5" width="5.5" height="1.5" rx="2.6" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.11s ease-in-out -0.71s infinite"/><rect x="949.0" y="294.2" width="5.5" height="7.8" rx="2.6" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.72s ease-in-out -2.12s infinite"/><rect x="963.5" y="282.3" width="5.5" height="19.7" rx="2.6" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.08s ease-in-out -2.36s infinite"/><rect x="978.0" y="274.2" width="5.5" height="27.8" rx="2.6" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.44s ease-in-out -1.44s infinite"/><rect x="992.5" y="277.0" width="5.5" height="25.0" rx="2.6" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.44s ease-in-out -1.19s infinite"/><rect x="1007.0" y="286.9" width="5.5" height="15.1" rx="2.6" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.64s ease-in-out -1.15s infinite"/><rect x="1021.5" y="287.2" width="5.5" height="14.8" rx="2.6" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.55s ease-in-out -1.79s infinite"/><rect x="1036.0" y="296.5" width="5.5" height="5.5" rx="2.6" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.50s ease-in-out -0.95s infinite"/><rect x="1050.5" y="297.0" width="5.5" height="5.0" rx="2.6" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.41s ease-in-out -1.52s infinite"/><rect x="1065.0" y="293.8" width="5.5" height="8.2" rx="2.6" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.68s ease-in-out -0.79s infinite"/><rect x="1079.5" y="280.4" width="5.5" height="21.6" rx="2.6" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.27s ease-in-out -1.30s infinite"/><rect x="1094.0" y="271.8" width="5.5" height="30.2" rx="2.6" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.95s ease-in-out -0.70s infinite"/><rect x="1108.5" y="287.0" width="5.5" height="15.0" rx="2.6" fill="url(#barFill)" opacity=".85" style="transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.29s ease-in-out -1.26s infinite"/>

    <!-- HUD status -->
